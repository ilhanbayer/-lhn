<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yahyalı — Dağların ve Suyun Coğrafyası</title>
  <style>
    :root{--cream:#f4eedf;--ink:#18352f;--green:#315d45;--sage:#8fae8c;--gold:#d0a44b;--sky:#bdd2c8}
    *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;font-family:Georgia,'Times New Roman',serif;background:#d5ddd5;color:var(--ink)}
    body{display:grid;place-items:center}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(145deg,#dce7df 0%,#b6cbbb 48%,#7d9b83 100%)}
    .grain{position:absolute;inset:0;opacity:.11;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
    .sun{position:absolute;width:38vmin;height:38vmin;border-radius:50%;right:-8vmin;top:-12vmin;background:rgba(255,236,177,.52);box-shadow:0 0 18vmin rgba(255,237,183,.8);animation:drift 18s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(-3vw,3vh)}}
    .land{position:absolute;inset:0}.peak{position:absolute;bottom:-2%;width:70%;height:78%;clip-path:polygon(0 100%,0 68%,12% 58%,20% 65%,31% 35%,42% 52%,54% 20%,67% 56%,79% 42%,91% 67%,100% 58%,100% 100%);transition:all 1.2s cubic-bezier(.2,.7,.2,1)}
    .back{right:-10%;background:#75917c;opacity:.75}.middle{left:-20%;width:88%;height:65%;background:#557361;opacity:.9;transform:scaleX(-1)}.front{right:-32%;width:78%;height:48%;background:#355544}
    .river{position:absolute;left:-10%;bottom:-20%;width:75%;height:72%;border-radius:50%;border:18px solid rgba(216,233,225,.55);transform:rotate(-32deg);filter:blur(.2px);box-shadow:0 0 28px rgba(204,229,221,.3);transition:opacity 1s}.river:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.45)}
    .mist{position:absolute;left:-10%;right:-10%;bottom:29%;height:16%;background:linear-gradient(transparent,rgba(238,242,233,.48),transparent);filter:blur(10px);animation:mist 14s linear infinite}@keyframes mist{50%{transform:translateX(7%)}}
    .panel{position:absolute;z-index:5;left:7vw;top:50%;width:min(46vw,680px);transform:translateY(-50%);padding:clamp(24px,4vw,64px);border-left:1px solid rgba(24,53,47,.25);text-shadow:0 1px 16px rgba(244,238,223,.5)}
    .eyebrow{font-family:Arial,sans-serif;font-size:clamp(11px,1vw,15px);letter-spacing:.32em;text-transform:uppercase;margin-bottom:18px;color:#476454}.title{font-size:clamp(52px,8.5vw,124px);line-height:.82;margin:0;font-weight:400;letter-spacing:-.05em}.subtitle{font-size:clamp(20px,2.4vw,38px);line-height:1.15;margin:26px 0 0;max-width:650px}.fact{font-family:Arial,sans-serif;font-size:clamp(13px,1.2vw,18px);line-height:1.6;margin-top:24px;max-width:520px;color:#304d40}
    .panel>*{opacity:0;transform:translateY(28px)}.panel.active>*{animation:reveal .9s forwards}.panel.active>.eyebrow{animation-delay:.08s}.panel.active>.title{animation-delay:.18s}.panel.active>.subtitle{animation-delay:.32s}.panel.active>.fact{animation-delay:.48s}@keyframes reveal{to{opacity:1;transform:none}}
    .counter{position:absolute;z-index:8;right:3vw;bottom:3vh;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.16em}.progress{position:absolute;z-index:8;left:3vw;bottom:3vh;width:180px;height:2px;background:rgba(24,53,47,.18)}.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width 5.8s linear}
    .mapmark{position:absolute;z-index:4;right:21%;top:31%;width:18px;height:18px;border-radius:50%;background:#eadcb1;border:3px solid #fff;box-shadow:0 0 0 9px rgba(255,255,255,.18),0 0 30px rgba(255,255,255,.7);opacity:0;transition:all 1s}.mapmark.on{opacity:1}.mapmark:after{content:"YAHYALI";position:absolute;left:27px;top:-8px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:.18em;white-space:nowrap;color:#fff;text-shadow:0 2px 8px #34584a}
    .waterfall{position:absolute;right:13%;top:31%;width:7%;height:38%;opacity:0;transition:opacity 1s}.waterfall i{display:block;position:absolute;width:5px;height:100%;background:rgba(230,241,237,.85);border-radius:50%;box-shadow:18px 8px 0 rgba(230,241,237,.55),36px -4px 0 rgba(230,241,237,.7)}.waterfall.on{opacity:.9}
    .controls{position:absolute;z-index:10;right:3vw;top:3vh}.controls button{width:42px;height:42px;border:1px solid rgba(24,53,47,.25);border-radius:50%;background:rgba(244,238,223,.35);color:var(--ink);cursor:pointer;margin-left:8px;backdrop-filter:blur(6px)}
    @media(max-width:700px){.panel{left:5vw;width:82vw;top:43%;padding:24px}.peak{height:55%}.middle{height:48%}.front{height:38%}.river{width:100%;bottom:-30%}.subtitle{margin-top:18px}.fact{margin-top:16px}.mapmark{right:20%;top:20%}}
  </style>
</head>
<body>
<div class="stage">
  <div class="sun"></div><div class="grain"></div><div class="land"><div class="peak back"></div><div class="peak middle"></div><div class="peak front"></div></div><div class="mist"></div><div class="river"></div>
  <div class="mapmark" id="mark"></div><div class="waterfall" id="falls"><i></i></div>
  <main class="panel active" id="panel"><div class="eyebrow">Kayseri’nin güneyinde</div><h1 class="title">Yahyalı</h1><p class="subtitle">Dağların, suyun ve yüksek yaylaların coğrafyası</p><p class="fact">Torosların gölgesinde yükselen bir ilçemizin manzarası.</p></main>
  <div class="controls"><button id="prev" aria-label="Önceki">←</button><button id="next" aria-label="Sonraki">→</button></div>
  <div class="progress"><i id="bar"></i></div><div class="counter" id="counter">01 / 06</div>
</div>
<script>
const scenes=[
  {eye:'Kayseri’nin güneyinde',title:'Yahyalı',sub:'Dağların, suyun ve yüksek yaylaların coğrafyası',fact:'Torosların gölgesinde yükselen bir ilçemizin manzarası.',mark:false,falls:false},
  {eye:'Doğu Toroslar',title:'Ala Dağlar',sub:'Kireçtaşından yükselen doruklar',fact:'Yahyalı’nın güneyi Aladağlar’ın kayalık yükseltileriyle tanımlanır.',mark:true,falls:false},
  {eye:'Zamantı Vadisi',title:'Zamantı',sub:'Akarsu vadisi; yaşamın geçtiği yol',fact:'Zamantı Irmağı, geniş bir havzada taşıdığı suyla kanyonlara ve ovalara yol verir.',mark:true,falls:false},
  {eye:'Su ile biçimlenen kaya',title:'Kapuzbaşı',sub:'Aladağlar’dan yuvarlanan şelaleler',fact:'Kapuzbaşı yöresi, vadi duvarlarından çıkan sayısız çağlayanla bilinir.',mark:true,falls:true},
  {eye:'Yükselen arazi',title:'Yaylalar',sub:'İklimi, ritmi ve yaşamı değiştiren yükseklik',fact:'Dağdan ovaya uzanan yaşam; rakım ve mevsimle birlikte değişir.',mark:true,falls:false},
  {eye:'Bir coğrafyanın bütünü',title:'Yahyalı',sub:'Kayalık dağ • akan su • bereketli vadi',fact:'Yahyalı’nın karakteri, farklı yükseltilerin birbirine bağlandığı coğrafyada saklıdır.',mark:true,falls:false}
];
let i=0,timer,panel;
const $=s=>document.querySelector(s); panel=$('#panel');
function render(reset=true){
  i=(i+scenes.length)%scenes.length;const s=scenes[i]; panel.classList.remove('active'); void panel.offsetWidth;
  panel.innerHTML=`<div class="eyebrow">${s.eye}</div><h1 class="title">${s.title}</h1><p class="subtitle">${s.sub}</p><p class="fact">${s.fact}</p>`;panel.classList.add('active');
  $('#mark').classList.toggle('on',s.mark);$('#falls').classList.toggle('on',s.falls);$('#counter').textContent=String(i+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');
  const b=$('#bar');b.style.transition='none';b.style.width='0';void b.offsetWidth;b.style.transition='width 5.8s linear';b.style.width='100%';
  if(reset){clearInterval(timer);timer=setInterval(()=>{i++;render(false)},5800)}
}
$('#next').onclick=()=>{i++;render(true)};$('#prev').onclick=()=>{i--;render(true)};
render(true);
</script>
</body>
</html>
